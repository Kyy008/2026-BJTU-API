name: Offerbot CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "offerbot/**"
      - ".github/workflows/offerbot-ci-cd.yml"
  pull_request:
    paths:
      - "offerbot/**"
      - ".github/workflows/offerbot-ci-cd.yml"
  workflow_dispatch:

concurrency:
  group: offerbot-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: offerbot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test
        run: mvn -B test

      - name: Package
        run: mvn -B package -DskipTests

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: offerbot-jar
          path: offerbot/target/offerbot-0.0.1-SNAPSHOT.jar
          if-no-files-found: error

      - name: Upload deployment files
        uses: actions/upload-artifact@v4
        with:
          name: offerbot-deploy-files
          path: |
            offerbot/Dockerfile
            offerbot/docker-compose.yml
            offerbot/.dockerignore
          if-no-files-found: error

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production

    steps:
      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: offerbot-jar
          path: dist

      - name: Download deployment files
        uses: actions/download-artifact@v4
        with:
          name: offerbot-deploy-files
          path: dist/deploy

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload deployment bundle
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" 'mkdir -p /home/kyy008/projects/offer-bot'
          scp dist/offerbot-0.0.1-SNAPSHOT.jar "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/kyy008/projects/offer-bot/offerbot.jar"
          scp dist/deploy/Dockerfile dist/deploy/docker-compose.yml dist/deploy/.dockerignore "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/kyy008/projects/offer-bot/"

      - name: Deploy offerbot container
        run: |
          ssh "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" <<'EOF'
          set -e
          cd /home/kyy008/projects/offer-bot
          cat > .env <<'ENVEOF'
          WECHAT_TOKEN=${{ secrets.WECHAT_TOKEN }}
          WECHAT_APP_ID=${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET=${{ secrets.WECHAT_APP_SECRET }}
          DB_URL=${{ secrets.DB_URL }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          ENVEOF
          if docker compose version >/dev/null 2>&1; then
            docker compose up -d --build --remove-orphans
          else
            docker-compose up -d --build --remove-orphans
          fi
          EOF
